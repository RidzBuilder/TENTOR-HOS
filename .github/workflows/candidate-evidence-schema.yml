name: Candidate Evidence Schema Conformance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "bootstrap/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-schema-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Validate schema and synthetic fixtures
        run: python tests/validate_candidate_evidence_schema.py

      - name: Run conservative semantic screening
        run: python tests/screen_candidate_evidence_semantics.py

      - name: Run adversarial semantic screening tests
        run: python tests/test_candidate_evidence_semantics_adversarial.py

      - name: Run negative controls
        run: python tests/test_candidate_evidence_schema_negative_controls.py

      - name: Run candidate aggregation semantics tests
        run: python tests/test_candidate_evidence_aggregation_semantics.py

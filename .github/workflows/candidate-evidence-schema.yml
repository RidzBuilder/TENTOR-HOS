name: Candidate Evidence Schema Conformance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "bootstrap/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-schema-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1"
      - name: Validate schema and synthetic fixtures
        run: python tests/validate_candidate_evidence_schema.py
